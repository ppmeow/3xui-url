# ============================================================
#  mihomo 配置模板（3x-ui 专用版）
#  基于 AIsouler/MyClash 全量版改编：https://github.com/AIsouler/MyClash
#  用法：填入 3x-ui 面板「Clash / Mihomo → 全局路由规则」，
#        面板只导入 dns、sniffer、rule-providers、proxy-groups、rules，
#        节点由面板自己生成，本文件不要填任何节点/订阅地址。
#  改动点（相对原版）：
#   1. 删除 proxy-providers 和自带直连节点（3x-ui 不导入，避免空订阅报错）
#   2. 「直连」组改用 mihomo 内置 DIRECT
#   3. 「默认代理」把 美国 排第一，开箱默认走美国节点
#   4. 新增 Disney 分组和 disney 规则集（默认走美国）
#   5. 新增 sniffer 段（面板开启 Use DNS from remote rules 后一并导入）
#   6. 2026-11-18 精简：地区组只留 美国、香港，其余已删（自建单节点用不上，空组会显示失败）
# ============================================================

# --- DNS 定义 ---
chinaDNS: &chinaDNS ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
foreignDNS: &foreignDNS ['https://cloudflare-dns.com/dns-query#默认代理', 'https://dns.google/dns-query#默认代理']
defaultDNS: &defaultDNS ['114.114.114.114#DIRECT', 'tls://223.5.5.5#DIRECT', 'https://1.12.12.12/dns-query#DIRECT']
proxyServerDNS: &proxyServerDNS ['114.114.114.114#DIRECT', 'tls://223.5.5.5#DIRECT', 'https://doh.pub/dns-query#DIRECT']

dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter', 'rule-set:cn', 'rule-set:googlefcm']
  default-nameserver: *defaultDNS
  proxy-server-nameserver: *proxyServerDNS
  nameserver: *foreignDNS
  nameserver-policy:
    'rule-set:private': 'system'
    'rule-set:douyin': ['180.184.1.1#DIRECT', '180.184.2.2#DIRECT']
    'rule-set:cn': *chinaDNS
  direct-nameserver: *chinaDNS
  direct-nameserver-follow-policy: true

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# --- 规则集 (Rule Providers) ---
rule_providers_domain: &rule_providers_domain { type: http, format: mrs, interval: 86400, behavior: domain }
rule_providers_ip: &rule_providers_ip { type: http, format: mrs, interval: 86400, behavior: ipcidr }

