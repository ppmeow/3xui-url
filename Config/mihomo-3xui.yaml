# --- 策略组 (Proxy Groups) ---
group_common_select:
  &group_common_select {
    type: select,
    timeout: 5000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://www.apple.com/library/test/success.html',
  }

group_common_auto:
  &group_common_auto {
    type: url-test,
    interval: 600,
    timeout: 5000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://www.apple.com/library/test/success.html',
    lazy: true,
    tolerance: 50,
    include-all: true,
    exclude-type: 'DIRECT',
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Auto.svg',
    hidden: true,
  }

group_common_load:
  &group_common_load {
    type: load-balance,
    interval: 600,
    timeout: 5000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://www.apple.com/library/test/success.html',
    lazy: true,
    strategy: 'sticky-sessions',
    include-all: true,
    exclude-type: 'DIRECT',
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/RoundRobin.svg',
    hidden: true,
  }

proxies_default:
  &proxies_default {
    proxies:
      [
        '默认代理',
        '手动选择',
        '自动选择',
        '负载均衡',
        '香港',
        '美国',
      ],
  }

proxies_direct:
  &proxies_direct {
    proxies:
      [
        '默认代理',
        '手动选择',
        '自动选择',
        '负载均衡',
        '直连',
        '香港',
        '美国',
      ],
  }

proxies_reject: &proxies_reject { proxies: ['REJECT', 'REJECT-DROP', 'PASS'] }

HK_filter: &HK_filter { filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong)' }
US_filter:
  &US_filter {
    filter: '(?i)(🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)',
  }
proxy-groups:
  - name: '默认代理'
    <<: *group_common_select
    proxies:
      [
        '美国',
        '手动选择',
        '自动选择',
        '负载均衡',
        '香港',
      ]
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Proxy.svg'

  - name: '手动选择'
    <<: *group_common_select
    include-all: true
    exclude-type: 'DIRECT'
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Static.svg'

  - name: '自动选择'
    <<: *group_common_auto

  - name: '负载均衡'
    <<: *group_common_load

  - name: 'FCM'
    <<: [*group_common_select, *proxies_direct]
